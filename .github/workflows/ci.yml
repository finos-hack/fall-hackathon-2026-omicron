name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Fluxnova plugin snapshot
        run: |
          git clone --depth 1 --branch llm-token-usage https://github.com/finos/fluxnova-plugins.git /tmp/fluxnova-plugins
          cd /tmp/fluxnova-plugins && mvn -B -N -DskipTests install
          cd /tmp/fluxnova-plugins/agentic-subprocess && mvn -B -DskipTests install

      - name: Backend tests
        run: mvn -B -Dtest='AfcRuleEngineTest,AfcTriageParsingTest' test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
